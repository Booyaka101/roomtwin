name: Demo

on:
  push:
    branches: [main]
    paths:
      - "demo/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "rollup.config.js"
      - "tsconfig.json"
      - ".github/workflows/demo.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.scan.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - id: scan
        run: |
          if [ -f demo/room.yaml ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No demo/room.yaml yet, so there is no demo to publish. See demo/README.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.scan.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.scan.outputs.ready == 'true'
        run: npm ci --ignore-scripts
      - if: steps.scan.outputs.ready == 'true'
        run: npm run typecheck
      - if: steps.scan.outputs.ready == 'true'
        run: npm test
      - if: steps.scan.outputs.ready == 'true'
        run: npm run demo
      - if: steps.scan.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    # A fork has no Pages site set up, so it builds the demo as a check and stops there.
    if: needs.build.outputs.ready == 'true' && !github.event.repository.fork
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
