name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v heading="## ${TAG#v}" '$0 == heading { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no '## ${TAG#v}' section"
            exit 1
          fi
      # A release made by hand on GitHub creates the tag too; it only needs the card attached.
      - run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/roomtwin-card.js --clobber
          else
            gh release create "$TAG" dist/roomtwin-card.js --title "$TAG" --notes-file notes.md
          fi

  hacs:
    needs: release
    runs-on: ubuntu-latest
    steps:
      # HACS checks the repo layout and wants a release with the card attached, so it runs once there is one.
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: plugin
